<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard local de hábitos diários" />
    <title>Habit Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">RITMO DIÁRIO</p>
          <h1>Pequenos passos, feitos hoje.</h1>
          <p id="today-label" class="muted"></p>
        </div>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Alternar tema">◐</button>
      </header>

      <section class="stats" aria-label="Resumo do dia">
        <article><span id="completed-count">0</span><p>concluídos</p></article>
        <article><span id="best-streak">0</span><p>melhor sequência</p></article>
        <article><span id="progress-percent">0%</span><p>progresso</p></article>
      </section>

      <section class="panel" aria-labelledby="habits-title">
        <div class="section-heading">
          <div><p class="eyebrow">CHECK-IN</p><h2 id="habits-title">Hábitos de hoje</h2></div>
          <button id="open-dialog" class="primary-button" type="button">+ Novo hábito</button>
        </div>
        <div id="progress-track" class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span></span></div>
        <ul id="habit-list" class="habit-list" aria-live="polite"></ul>
      </section>
    </main>

    <dialog id="habit-dialog">
      <form id="habit-form" method="dialog">
        <h2>Novo hábito</h2>
        <label for="habit-name">Nome</label>
        <input id="habit-name" name="habit-name" maxlength="40" required placeholder="Ex.: Ler 20 minutos" />
        <div class="dialog-actions">
          <button value="cancel" type="button" id="close-dialog">Cancelar</button>
          <button class="primary-button" value="default" type="submit">Adicionar</button>
        </div>
      </form>
    </dialog>
    <p id="announcement" class="sr-only" aria-live="assertive"></p>
    <script src="app.js"></script>
  </body>
</html>
